# Incident catalog: stablecoin depegs/collapses, venue hacks, freezes, oracle and governance events.
# Scope: 2022-01 .. 2026-10-20. Methodology and base rates: docs/research/incidents.md.
#
# Field conventions:
# - tier_like: A = fiat-backed / major stable, or a lending receipt of one on a major venue
#   (aUSDC-like); B = synthetic / yield-bearing dollar; C = other (algorithmic, non-dollar
#   collateral, third-party wrappers, small venues).
# - min_price_usd: worst widely reported traded price; venue-specific prints are flagged in notes.
# - holder_loss_pct: permanent loss for someone who held the affected asset (or deposit) through
#   to resolution, NOT the loss of someone who sold at the bottom. Best estimate; ranges in notes.
# - All values are estimated/historical and come from secondary reporting unless noted.

incidents:
  - id: ust-terra-2022-05
    date: 2022-05-09
    kind: collapse
    assets: [UST]
    protocols: [terra, anchor]
    tier_like: C
    min_price_usd: "0.01"
    duration_days: null
    holder_loss_pct: "98"
    recovered: false
    summary: "Algorithmic stablecoin UST lost its peg in a reflexive UST/LUNA death spiral (about $0.35 by May 9, ~$0.17 by May 13) and never recovered; the SEC puts combined UST/LUNA value destroyed at over $40B."
    sources:
      - https://coindesk.com/learn/the-fall-of-terra-a-timeline-of-the-meteoric-rise-and-crash-of-ust-and-luna
      - https://corporatefinanceinstitute.com/resources/cryptocurrency/what-happened-to-terra
    notes: "min_price_usd reflects where UST (later USTC) settled in the following months (~$0.01-0.02); sources for the May 2022 lows vary. Terra 2.0 airdrop compensation was partial and in a new volatile token. Classified C (endogenous collateral); base rate for algorithmic designs only."

