# Asset and protocol whitelist (agreed in docs/decisions.md, 2026-10-20).
# Anything not listed here is rejected. Tier C is never allowed.
# Addresses are checked against chain data (`make verify-whitelist`). Assets without a pinned
# address on a chain can be observed and scored in research mode but are never executable there.

protocols:
  pendle:
    llama_slug: pendle
    kind: venue
    launched: 2021-06
    audits: 6
    admin_pause: true
    upgradeable: true
    centralized_counterparty: false
    oracle_dependency: low
    notes: Fixed-rate PT/YT AMM. Penpie (third-party) exploit Sep 2024 did not affect Pendle core.
  aave-v3:
    llama_slug: aave-v3
    kind: lending
    launched: 2022-03
    audits: 10
    admin_pause: true
    upgradeable: true
    centralized_counterparty: false
    oracle_dependency: high
    notes: Parking venue; also issuer of aTokens used as PT underlyings.
  compound-v3:
    llama_slug: compound-v3
    kind: lending
    launched: 2022-08
    audits: 6
    admin_pause: true
    upgradeable: true
    centralized_counterparty: false
    oracle_dependency: high
    notes: Parking venue (Comet USDC markets).
  circle:
    kind: issuer
    cap_exempt: true
    launched: 2018-09
    audits: 0
    admin_pause: true
    upgradeable: true
    centralized_counterparty: true
    oracle_dependency: none
    notes: USDC issuer; fiat-backed, can freeze addresses. Depeg Mar 2023 (SVB).
  tether:
    kind: issuer
    cap_exempt: true
    launched: 2014-10
    audits: 0
    admin_pause: true
    upgradeable: true
    centralized_counterparty: true
    oracle_dependency: none
    notes: USDT issuer; attestations, not full audits; can freeze addresses.
  sky:
    llama_slug: sky-lending
    kind: issuer
    launched: 2017-12
    audits: 10
    admin_pause: true
    upgradeable: false
    centralized_counterparty: true
    oracle_dependency: high
    notes: DAI/USDS (ex-MakerDAO); large RWA/USDC backing.
  ethena:
    llama_slug: ethena-usde
    kind: issuer
    launched: 2024-02
    audits: 5
    admin_pause: true
    upgradeable: true
    centralized_counterparty: true
    oracle_dependency: medium
    notes: USDe synthetic dollar (delta-neutral perp hedge, CEX custody via off-exchange settlement). Peg dip to ~0.65 on Binance on 2025-10-10 while on-chain redemption held.

